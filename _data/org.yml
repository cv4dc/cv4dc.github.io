# Ways to support the organization.
support:
  - title: Sponsor a workshop
    text: "Sponsorship funds registration and travel support for presenting authors from developing countries, and keeps the workshop free to attend. We will work with you on how your organization is acknowledged."
  - title: Volunteer your time
    text: "We are always looking for reviewers, mentors, challenge organizers and invited speakers. If you work in computer vision and want to help, tell us what you would like to take on."
  - title: Partner with us
    text: "Universities, research labs and companies working in or with developing regions can partner with us on programs, datasets and local events."

